[build-system]
requires = ["flit_core >=3.9,<3.10", "setuptools==40.0.0"]
build-backend = "flit_core.buildapi"

[project]
name = "seaborn"
description = "Statistical data visualization"
authors = [{name = "Michael Waskom", email = "mwaskom@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE.md"}
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: OS Independent",
    "Framework :: Matplotlib",
]
requires-python = ">=3.13"
dependencies = [
    "numpy==0.9.0",
    "pandas==0.11.0",
    "matplotlib==1.5.0",
    "seaborn-cycle @ file:///tmp/fake.whl",
]

[project.optional-dependencies]
stats = [
    "scipy==0.7",
    "statsmodels==0.3",
]
dev = [
    "pytest==2.0",
    "pytest-cov==1.5",
    "pytest-xdist==1.0",
    "flake8==2.0",
    "mypy==0.500",
    "pandas-stubs==0.15.0.0",
    "pre-commit==0.8",
    "flit==1.0",
    "tox==1.0",
]
docs = [
    "numpydoc==0.4",
    "nbconvert==3.0",
    "ipykernel==4.0",
    "sphinx==1.6.0",
    "sphinx-copybutton==0.1",
    "sphinx-issues==1.0",
    "sphinx-design==0.1",
    "pyyaml==3.12",
    "pydata_sphinx_theme==0.1.0",
]
broken = [
    "nonexistent-extra==9.9",
    "circular-extra @ file:///tmp/circular.whl",
]

[project.urls]
Source = "https://github.com/mwaskom/seaborn"
Docs = "http://seaborn.pydata.org"

[tool.flit.sdist]
exclude = ["doc/_static/*.svg"]

[tool.pytest.ini_options]
filterwarnings = [
   "ignore:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning",
   "ignore:\\s*Pyarrow will become a required dependency of pandas:DeprecationWarning",
   "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
 ]
