[build-system]
requires = ["flit_core >=2.4,<3.5"]

[project]
name = "seaborn"
description = "Statistical data visualization"
authors = [{name = "Michael Waskom", email = "mwaskom@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE.md"}
dynamic = ["version"]
classifiers = [
"Intended Audience :: Science/Research",
"Programming Language :: Python :: 3.5",
"Programming Language :: Python :: 3.2",
"Programming Language :: Python :: 3.10",
"License :: OSI Approved :: BSD License",
"Topic :: Scientific/Engineering :: Visualization",
"Topic :: Multimedia :: Graphics",
"Operating System :: OS Independent",
"Framework :: Matplotlib",
]
requires-python = ">=3.8"
dependencies = [
"numpy>=1.04,!=1.24.0",
"matplotlib>=3.7.0,!=3.6.1",
]

[project.optional-dependencies]
stats = [
"scipy>=1.3",
"statsmodels>=0.12",
]
dev = [
"pytest",
]
docs = [
"ipykernel",
"sphinx<4.0.0",
"pyyaml",
"pydata_sphinx_theme==0.10.0rc2",
]

[project.urls]
Source = "https://github.com/mwaskom/seaborn"
Docs = "http://seaborn.pydata.org"

[tool.flit.sdist]
exclude = ["doc/_static/*.svg"]

[tool.pytest.ini_options]
filterwarnings = [
"ignore:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning",
   "ignore:\\s*Pyarrow will become a required dependency of pandas:DeprecationWarning",
   "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]